<!-- 顺序很重要：data/site.js（站点身份）→ observatory.js（签名组件）→ app.js（框架）→ data/index.js（章节清单） -->

<script>
/* 启动遮罩兜底：JS 组件缺失或出错时，2.8 秒后强制收起 */
setTimeout(function () {
  var b = document.getElementById('boot');
  if (!b || b.classList.contains('done')) return;
  b.classList.add('done');
  setTimeout(function () { if (b && b.parentNode) b.parentNode.removeChild(b); }, 600);
}, 2800);
/* PWA：http(s) 下注册 service worker，离线可用；file:// 双击打开时浏览器不允许注册，静默跳过 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    function offerReload() {
      var t = document.getElementById('toast');
      if (!t || t.getAttribute('data-update') === '1') return;
      t.setAttribute('data-update', '1');
      t.textContent = '已有新版本 · 点击刷新';
      t.className = 'toast on ok';
      t.style.cursor = 'pointer';
      t.addEventListener('click', function () { location.reload(); });
    }
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) offerReload();
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) offerReload();
        });
      });
    }).catch(function () {});
  });
}
</script>
<script>
/* 入场幕布：接住观测台的四色过场，双层 rAF 确保已绘制一帧后再滑出 */
(function(){
  var c = document.getElementById('gateCurtain');
  if (!c) return;
  function remove(){ try{ if (c && c.parentNode) c.parentNode.removeChild(c); }catch(e){} }
  function out(){
    try{
      c.style.transition = 'transform .5s cubic-bezier(.7,0,.3,1)';
      c.style.transform = 'skewX(-15deg) translateX(100%)';
    }catch(e){}
    setTimeout(remove, 620);
  }
  requestAnimationFrame(function(){ requestAnimationFrame(out); });
  setTimeout(remove, 3000); /* 兜底：任何异常都不会把幕布留在屏幕上 */
})();
</script>

<!-- ============ 返回学习中心：四色幕布压屏后跳转 ============ -->
<script>
/* 「返回观测台」：与观测台进入子站同一套四色幕布转场。
   <a> 本身可直达，JS 只负责过渡；修饰键点击 / 减少动态效果时走浏览器默认行为。
   若单独以子站目录起服务器（目标会解析回自身），说明没有观测台，隐藏按钮。 */
(function () {
  var btn = document.getElementById('hubBack');
  if (!btn) return;
  var href = btn.getAttribute('href');
  try {
    var probe = document.createElement('a');
    probe.href = href;
    function norm(u) { return String(u).replace(/index\.html$/, '').split('#')[0]; }
    if (norm(probe.href) === norm(location.href)) { btn.style.display = 'none'; return; }
  } catch (e) { /* 解析失败就按默认显示 */ }
  btn.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var curtain = document.getElementById('curtain');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!href || !curtain || reduce) return;
    e.preventDefault();
    curtain.classList.remove('out');
    curtain.classList.add('on', 'in');
    /* 与 hub.js 的进入动画一致：.46s 幕布到位 + 100ms 停留再导航 */
    setTimeout(function () { window.location.href = href; }, 560);
  });
})();
</script>
